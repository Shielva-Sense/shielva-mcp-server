line-length = 120
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "BLE", "A", "COM", "DTZ", "ISC", "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PL", "RUF"]
ignore = [
    "E501", "COM812", "ISC001", "PLR0913", "PLR2004", "S101", "B008", "PLC0415",
    "ARG001", "ARG002", "ARG003", "ARG005", "BLE001", "E402", "PLW0603", "PLW0602",
    "PLW2901", "RUF001", "RUF002", "RUF003", "PLR0915", "PLR0912", "PLR0911",
    "PLR0914", "PLR0904", "S110", "S112", "SIM105", "DTZ003", "B904",
    # style / preference families present in this codebase (not behaviour bugs)
    "PTH",      # os.path vs pathlib is a preference
    "UP042",    # StrEnum __str__ semantics
    "UP007",    # X | Y annotation preference (py311 typing.Optional still valid)
    "RUF012",   # mutable class default (pydantic Field/ClassVar handles it)
    "RUF013",   # implicit Optional (foo: str = None) — legacy but harmless
    "RUF005",   # collection-literal concatenation style
    "RUF059",   # unused unpacked var in tests
    "B007",     # unused loop var
    "SIM102",   # nested-if collapse preference
    "PT028",    # pytest param default
    "DTZ005",   # naive datetime.now — non-security timestamps
    "S104",     # container bind 0.0.0.0
    "S310",     # url-open (internal healthcheck localhost)
    "S311",     # non-crypto random (mock embeddings only)
]

[lint.isort]
# Deterministic first-party classification — otherwise import grouping (I001)
# depends on whether ruff auto-detects the `src` layout, which differs between
# a local checkout and the CI's fresh clone (rag_engine is a symlink).
known-first-party = ["src", "config", "shared"]

[lint.per-file-ignores]
"scripts/**" = ["S"]
"tests/**" = ["S", "ARG"]
